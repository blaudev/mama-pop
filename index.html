<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a3d6c" />
    <title>Mama Pop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Caveat:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Instalable como app (PWA): manifiesto, icono para iOS y service worker para jugar sin conexión -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mama Pop" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {}));
      }
    </script>
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <div id="tank" class="tank" role="progressbar" aria-label="Burbujas rotas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="tank-water" class="tank-water"></div>
          <span id="tank-swimmer" class="tank-swimmer" aria-hidden="true"></span>
          <span class="tank-flag" aria-hidden="true"></span>
        </div>
        <div class="left"><span id="left" class="left-value">0</span><span class="left-label">quedan</span></div>
        <button id="maps" class="icon-btn" type="button" aria-label="Volver a los niveles">☰</button>
        <button id="mute" class="icon-btn" type="button" aria-label="Silenciar">🔊</button>
      </header>

      <div class="stage">
        <canvas id="board" aria-label="Tablero de burbujas"></canvas>

        <nav class="specials" aria-label="Bolas especiales">
          <button id="special-rocket" class="special" type="button" aria-pressed="false" aria-label="Cohete: quedan 0" disabled>
            <svg class="icon" viewBox="0 0 40 60" aria-hidden="true">
              <path d="M9 34 L2 50 L10 47 Z" fill="#e5484d" />
              <path d="M31 34 L38 50 L30 47 Z" fill="#e5484d" />
              <path d="M20 2 C 30 12, 32 26, 31 46 L 9 46 C 8 26, 10 12, 20 2 Z" fill="#f4ecdf" stroke="#7a5418" stroke-width="1.5" />
              <path d="M20 2 C 25.5 7.5, 28.3 13, 29.4 18 L 10.6 18 C 11.7 13, 14.5 7.5, 20 2 Z" fill="#e5484d" />
              <circle cx="20" cy="28" r="5.5" fill="#2a8fc4" stroke="#c9953c" stroke-width="2" />
              <path d="M13 46 h14 l-2 5 h-10 Z" fill="#5a6470" />
              <path class="flame" d="M14 52 C 14 56, 20 60, 20 60 C 20 60, 26 56, 26 52 Z" fill="#ff8a1f" />
            </svg>
            <span id="rocket-count" class="count">0</span>
          </button>
          <button id="special-mine" class="special" type="button" aria-pressed="false" aria-label="Mina: quedan 0" disabled>
            <svg class="icon" viewBox="0 0 96 96" aria-hidden="true">
              <g stroke="#c9953c" stroke-width="8" stroke-linecap="round">
                <path d="M48 8v14M48 74v14M8 48h14M74 48h14M20 20l10 10M66 66l10 10M76 20l-10 10M30 66l-10 10" />
              </g>
              <circle cx="48" cy="48" r="28" fill="#1f3550" stroke="#0b1a2c" stroke-width="3" />
              <circle class="light" cx="48" cy="38" r="7" fill="#ff4a4a" />
            </svg>
            <span id="mine-count" class="count">0</span>
          </button>
          <button id="special-rainbow" class="special" type="button" aria-pressed="false" aria-label="Perla arcoíris: quedan 0" disabled>
            <span class="icon rainbow"></span>
            <span id="rainbow-count" class="count">0</span>
          </button>
        </nav>

        <div id="overlay" class="overlay">
          <div class="card">
            <h1 id="overlay-title">Mama Pop</h1>
            <p id="overlay-text"></p>
            <ul id="overlay-help" class="help">
              <li><b>Ratón</b>: apuntar y clic para disparar · <b>Dedo</b>: arrastra o mantén y suelta para disparar</li>
              <li><b>Tocar la burbuja</b> del lanzador: girar y cambiar</li>
              <li><b>← →</b> apuntar · <b>Espacio</b> disparar · <b>C</b> cambiar · <b>R</b> / <b>M</b> / <b>A</b> cohete, mina, arcoíris</li>
            </ul>
            <div id="overlay-levels" class="levels"></div>
            <div id="overlay-actions" class="actions"></div>
          </div>
          <div id="overlay-screen" class="screen" hidden></div>
        </div>
      </div>
    </main>
    <script type="module" src="src/game.js"></script>
  </body>
</html>
